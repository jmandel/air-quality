<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ask About Your Air Quality</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --surface: #15213a;
      --surface-alt: #1c2a47;
      --border: #223352;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #f97316;
      --success: #22c55e;
      --warning: #f59e0b;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      padding: 24px clamp(16px, 5vw, 48px);
      background: linear-gradient(135deg, var(--surface), var(--surface-alt));
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
    }

    .title h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 32px);
    }

    .title .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .back-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      transition: opacity 0.2s;
    }

    .back-link:hover {
      opacity: 0.8;
    }

    .content {
      flex: 1;
      padding: clamp(16px, 5vw, 48px);
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .query-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-row {
      display: flex;
      gap: 12px;
    }

    .query-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
    }

    .query-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .ask-btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 12px;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .ask-btn:hover:not(:disabled) {
      opacity: 0.9;
    }

    .ask-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .example-chip, .starred-chip {
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .starred-chip {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
      color: var(--accent);
    }

    .starred-chip::before {
      content: "⭐ ";
    }

    .example-chip:hover, .starred-chip:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
      color: var(--accent);
    }

    .loading {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #progress-messages {
      width: 100%;
      max-height: 400px;
      overflow-y: auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-family: "SF Mono", "Monaco", "Inconsolata", "Fira Code", "Roboto Mono", monospace;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    #progress-messages:empty::before {
      content: "Waiting for Shelley...";
      color: var(--muted);
      font-style: italic;
    }
      margin: 4px 0;
      font-size: 14px;
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
    }

    .spinner {
      display: inline-block;
      width: 48px;
      height: 48px;
      border: 4px solid rgba(148, 163, 184, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-box {
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid rgba(249, 115, 22, 0.3);
      border-left: 4px solid var(--danger);
      border-radius: 12px;
      padding: 20px;
      color: var(--danger);
    }

    .dashboard {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .summary {
      background: var(--surface);
      border-left: 4px solid var(--accent);
      border-radius: 12px;
      padding: 20px;
      font-size: 16px;
      line-height: 1.6;
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 24px;
    }

    .tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      transition: transform 0.2s;
    }

    .tile:hover {
      transform: translateY(-2px);
    }

    .tile-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* Text tile variants */
    .tile.text-info { border-left: 4px solid var(--accent); }
    .tile.text-warning { border-left: 4px solid var(--warning); }
    .tile.text-success { border-left: 4px solid var(--success); }
    .tile.text-error { border-left: 4px solid var(--danger); }

    .text-content {
      line-height: 1.6;
    }

    .text-content p {
      margin: 0 0 12px;
    }

    .text-content p:last-child {
      margin-bottom: 0;
    }

    .text-content strong {
      color: var(--accent);
    }

    /* Metric tile */
    .tile.metric {
      text-align: center;
    }

    .tile.metric.good {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.15) 0%, var(--surface) 100%);
    }

    .tile.metric.warning {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, var(--surface) 100%);
    }

    .tile.metric.critical {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.15) 0%, var(--surface) 100%);
    }

    .metric-value {
      font-size: 56px;
      font-weight: 700;
      line-height: 1;
      margin: 16px 0;
    }

    .metric-unit {
      font-size: 24px;
      color: var(--muted);
      margin-left: 8px;
    }

    .metric-trend {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 999px;
      font-size: 14px;
    }

    .trend-arrow {
      font-size: 20px;
    }

    .trend-arrow.up { color: var(--danger); }
    .trend-arrow.down { color: var(--success); }
    .trend-arrow.stable { color: var(--muted); }

    /* Chart tile */
    .tile.chart {
      grid-column: span 2;
      min-height: 400px;
    }

    @media (max-width: 1200px) {
      .tile.chart {
        grid-column: span 1;
      }
    }

    .chart-container {
      position: relative;
      height: 350px;
      margin-top: 16px;
    }

    /* History catalog */
    .history-catalog {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-top: 48px;
    }

    .history-catalog h2 {
      margin: 0 0 16px;
      font-size: 18px;
      color: var(--text);
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 400px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      transition: background 0.2s;
    }

    .history-item:hover {
      background: rgba(56, 189, 248, 0.1);
    }

    .history-item-question {
      flex: 1;
      cursor: pointer;
      color: var(--text);
    }

    .history-item-time {
      font-size: 12px;
      color: var(--muted);
    }

    .history-item-actions {
      display: flex;
      gap: 8px;
    }

    .history-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .history-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .history-btn.starred {
      color: var(--warning);
    }

    .hidden {
      display: none;
    }
    
    /* Result tabs */
    .result-tabs {
      width: 100%;
    }
    
    .tab-buttons {
      display: flex;
      gap: 0.5rem;
      border-bottom: 2px solid var(--border);
      margin-bottom: 1.5rem;
    }
    
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      margin-bottom: -2px;
    }
    
    .tab-btn:hover {
      color: var(--text);
      background: var(--surface-alt);
    }
    
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    
    .tab-content {
      min-height: 300px;
    }
    
    .tab-pane {
      display: none;
    }
    
    .tab-pane.active {
      display: block;
      animation: fadeIn 0.2s;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .code-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      overflow-x: auto;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--text);
      white-space: pre;
      max-height: 600px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="title">
      <h1>🤖 Ask About Your Air Quality</h1>
      <p class="subtitle">Natural language queries with interactive dashboards</p>
    </div>
    <a href="/" class="back-link">← Back to Viewer</a>
  </div>

  <div class="content">
    <div class="query-box">
      <div class="input-row">
        <input 
          type="text" 
          id="query-input"
          class="query-input"
          placeholder="What is the current CO₂ level?"
          autocomplete="off"
        />
        <button id="ask-btn" class="ask-btn">Ask</button>
      </div>

      <div id="starred-section" class="hidden">
        <div class="section-title">Starred Queries</div>
        <div id="starred-chips" class="examples"></div>
      </div>

      <div>
        <div class="section-title">Example Queries</div>
        <div class="examples">
          <span class="example-chip" data-query="What is the current CO₂ level?">Current CO₂</span>
          <span class="example-chip" data-query="Is the air quality good right now?">Air quality status</span>
          <span class="example-chip" data-query="Show me PM2.5 over the last hour">PM2.5 trend</span>
          <span class="example-chip" data-query="What was the peak temperature today?">Peak temperature</span>
          <span class="example-chip" data-query="Compare CO₂ now vs 1 hour ago">Compare CO₂</span>
        </div>
      </div>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <div id="progress-messages"></div>
    </div>

    <div id="error" class="error-box hidden"></div>

    <div id="dashboard" class="dashboard hidden"></div>

    <div id="history-catalog" class="history-catalog hidden">
      <h2>📚 Query History</h2>
      <div id="history-list" class="history-list"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  <script type="module" src="./ask.ts"></script>
</body>
</html>
