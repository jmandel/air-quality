<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ask About Your Air Quality</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --surface: #15213a;
      --surface-alt: #1c2a47;
      --border: #223352;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #f97316;
      --success: #22c55e;
      --warning: #f59e0b;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      padding: 24px clamp(16px, 5vw, 48px);
      background: linear-gradient(135deg, var(--surface), var(--surface-alt));
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
    }

    .title h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 32px);
    }

    .title .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .back-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      transition: opacity 0.2s;
    }

    .back-link:hover {
      opacity: 0.8;
    }

    .content {
      flex: 1;
      padding: clamp(16px, 5vw, 48px);
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .query-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-row {
      display: flex;
      gap: 12px;
    }

    .query-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
    }

    .query-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .ask-btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 12px;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .ask-btn:hover:not(:disabled) {
      opacity: 0.9;
    }

    .ask-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .example-chip {
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .example-chip:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
      color: var(--accent);
    }

    .loading {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
    }

    .spinner {
      display: inline-block;
      width: 48px;
      height: 48px;
      border: 4px solid rgba(148, 163, 184, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-box {
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid rgba(249, 115, 22, 0.3);
      border-left: 4px solid var(--danger);
      border-radius: 12px;
      padding: 20px;
      color: var(--danger);
    }

    .dashboard {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .summary {
      background: var(--surface);
      border-left: 4px solid var(--accent);
      border-radius: 12px;
      padding: 20px;
      font-size: 16px;
      line-height: 1.6;
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 24px;
    }

    .tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      transition: transform 0.2s;
    }

    .tile:hover {
      transform: translateY(-2px);
    }

    .tile-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* Text tile variants */
    .tile.text-info { border-left: 4px solid var(--accent); }
    .tile.text-warning { border-left: 4px solid var(--warning); }
    .tile.text-success { border-left: 4px solid var(--success); }
    .tile.text-error { border-left: 4px solid var(--danger); }

    .text-content {
      line-height: 1.6;
    }

    .text-content p {
      margin: 0 0 12px;
    }

    .text-content p:last-child {
      margin-bottom: 0;
    }

    .text-content strong {
      color: var(--accent);
    }

    /* Metric tile */
    .tile.metric {
      text-align: center;
    }

    .tile.metric.good {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.15) 0%, var(--surface) 100%);
    }

    .tile.metric.warning {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, var(--surface) 100%);
    }

    .tile.metric.critical {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.15) 0%, var(--surface) 100%);
    }

    .metric-value {
      font-size: 56px;
      font-weight: 700;
      line-height: 1;
      margin: 16px 0;
    }

    .metric-unit {
      font-size: 24px;
      color: var(--muted);
      margin-left: 8px;
    }

    .metric-trend {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 999px;
      font-size: 14px;
    }

    .trend-arrow {
      font-size: 20px;
    }

    .trend-arrow.up { color: var(--danger); }
    .trend-arrow.down { color: var(--success); }
    .trend-arrow.stable { color: var(--muted); }

    /* Chart tile */
    .tile.chart {
      grid-column: span 2;
      min-height: 400px;
    }

    @media (max-width: 1200px) {
      .tile.chart {
        grid-column: span 1;
      }
    }

    .chart-container {
      position: relative;
      height: 350px;
      margin-top: 16px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="title">
      <h1>🤖 Ask About Your Air Quality</h1>
      <p class="subtitle">Natural language queries with interactive dashboards</p>
    </div>
    <a href="/" class="back-link">← Back to Viewer</a>
  </div>

  <div class="content">
    <div class="query-box">
      <div class="input-row">
        <input 
          type="text" 
          id="query-input"
          class="query-input"
          placeholder="What is the current CO₂ level?"
          autocomplete="off"
        />
        <button id="ask-btn" class="ask-btn">Ask</button>
      </div>

      <div class="examples">
        <span class="example-chip" data-query="What is the current CO₂ level?">Current CO₂</span>
        <span class="example-chip" data-query="Is the air quality good right now?">Air quality status</span>
        <span class="example-chip" data-query="Show me PM2.5 over the last hour">PM2.5 trend</span>
        <span class="example-chip" data-query="What was the peak temperature today?">Peak temperature</span>
        <span class="example-chip" data-query="Compare CO₂ now vs 1 hour ago">Compare CO₂</span>
      </div>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Analyzing data...</p>
    </div>

    <div id="error" class="error-box hidden"></div>

    <div id="dashboard" class="dashboard hidden"></div>
  </div>

  <script type="module" src="./ask.ts"></script>
</body>
</html>
