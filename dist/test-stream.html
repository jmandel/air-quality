<!DOCTYPE html>
<html>
<head>
  <title>Test Streaming</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #ddd; }
    #output { border: 1px solid #444; padding: 10px; margin-top: 10px; min-height: 200px; max-height: 400px; overflow-y: auto; }
    button { padding: 10px 20px; cursor: pointer; }
    .event { padding: 5px; margin: 2px 0; border-left: 3px solid #666; }
    .status { border-color: #38bdf8; }
    .error { border-color: #f87171; background: #3a1a1a; }
    .result { border-color: #22c55e; background: #1a3a1a; }
  </style>
<script type="module" crossorigin src="./test-stream-fsjay33b.js"></script></head>
<body>
  <h1>Streaming Test</h1>
  <button onclick="testStream()">Test Stream</button>
  <div id="output"></div>
  
  <script>
    function testStream() {
      const output = document.getElementById('output');
      output.innerHTML = '<div class="status">Starting...</div>';
      
      const eventSource = new EventSource('/api/ask/stream?q=what+is+the+co2+level');
      
      eventSource.addEventListener('status', (e) => {
        const data = JSON.parse(e.data);
        output.innerHTML += `<div class="event status">STATUS: ${data}</div>`;
        output.scrollTop = output.scrollHeight;
      });
      
      eventSource.addEventListener('cached', (e) => {
        output.innerHTML += `<div class="event">CACHED: ${e.data}</div>`;
        output.scrollTop = output.scrollHeight;
      });
      
      eventSource.addEventListener('shelley_progress', (e) => {
        const data = JSON.parse(e.data);
        output.innerHTML += `<div class="event">SHELLEY: ${data}</div>`;
        output.scrollTop = output.scrollHeight;
      });
      
      eventSource.addEventListener('shelley_complete', (e) => {
        const data = JSON.parse(e.data);
        output.innerHTML += `<div class="event status">SHELLEY DONE: Exit ${data.exitCode}, ${data.outputLength} bytes</div>`;
        output.scrollTop = output.scrollHeight;
      });
      
      eventSource.addEventListener('script_created', (e) => {
        const data = JSON.parse(e.data);
        output.innerHTML += `<div class="event">SCRIPT: ${data.size} bytes</div>`;
        output.scrollTop = output.scrollHeight;
      });
      
      eventSource.addEventListener('script_progress', (e) => {
        const data = JSON.parse(e.data);
        output.innerHTML += `<div class="event">EXEC: ${data}</div>`;
        output.scrollTop = output.scrollHeight;
      });
      
      eventSource.addEventListener('script_complete', (e) => {
        const data = JSON.parse(e.data);
        output.innerHTML += `<div class="event status">EXEC DONE: Exit ${data.exitCode}, ${data.outputLength} bytes</div>`;
        output.scrollTop = output.scrollHeight;
      });
      
      eventSource.addEventListener('result', (e) => {
        const data = JSON.parse(e.data);
        output.innerHTML += `<div class="event result">RESULT: ${JSON.stringify(data, null, 2).substring(0, 200)}...</div>`;
        output.scrollTop = output.scrollHeight;
      });
      
      eventSource.addEventListener('saved', (e) => {
        output.innerHTML += `<div class="event status">SAVED</div>`;
        output.scrollTop = output.scrollHeight;
        eventSource.close();
      });
      
      eventSource.addEventListener('error', (e) => {
        try {
          const data = JSON.parse(e.data);
          output.innerHTML += `<div class="event error">ERROR: ${data.message}</div>`;
        } catch {
          output.innerHTML += `<div class="event error">ERROR: Connection error</div>`;
        }
        output.scrollTop = output.scrollHeight;
        eventSource.close();
      });
      
      eventSource.onerror = () => {
        if (eventSource.readyState === EventSource.CLOSED) {
          output.innerHTML += `<div class="event">Stream closed</div>`;
        } else {
          output.innerHTML += `<div class="event error">Connection failed</div>`;
          eventSource.close();
        }
        output.scrollTop = output.scrollHeight;
      };
    }
  </script>
</body>
</html>
