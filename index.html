<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AIR‑1 Dashboard</title>

  <style>
    :root {
      --bg: #0b0f14;
      --surface: #121821;
      --surface-hover: #1a2330;
      --border: #1e2936;
      --text: #e6edf3;
      --text-muted: #8aa0b4;
      --accent: #39b26b;
      --accent-hover: #45c777;
      --danger: #ff7a7a;
      --warn: #ffcc66;
      --grid: rgba(138, 160, 180, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, sans-serif;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      background: var(--surface-hover);
      border: 1px solid var(--border);
    }

    .status-badge[data-status="streaming"] {
      background: rgba(57, 178, 107, 0.1);
      border-color: var(--accent);
      color: var(--accent);
    }

    .status-badge[data-status="error"] {
      background: rgba(255, 122, 122, 0.1);
      border-color: var(--danger);
      color: var(--danger);
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background: var(--surface-hover);
    }

    .config-panel {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .config-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .config-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .sensor-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sensor-chip {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sensor-chip:hover {
      border-color: var(--accent);
    }

    .sensor-chip.active {
      background: rgba(57, 178, 107, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    .config-footer {
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 12px;
    }

    input[type="url"],
    input[type="number"],
    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      min-width: 200px;
    }

    input[type="url"] {
      flex: 1;
      min-width: 300px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }

    button {
      background: var(--accent);
      color: #04130a;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.secondary {
      background: var(--surface-hover);
      color: var(--text);
    }

    button.secondary:hover {
      background: var(--border);
    }

    button.danger {
      background: var(--danger);
      color: #2d0000;
    }

    button.warn {
      background: var(--warn);
      color: #211a00;
    }

    .dashboard {
      flex: 1;
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
      align-content: start;
    }

    @media (max-width: 768px) {
      .dashboard {
        grid-template-columns: 1fr;
        padding: 16px;
      }
    }

    .chart-tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s;
    }

    .chart-tile:hover {
      border-color: rgba(138, 160, 180, 0.3);
    }

    .tile-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .tile-title {
      flex: 1;
    }

    .sensor-name {
      font-size: 14px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .current-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      margin-top: 4px;
      line-height: 1;
    }

    .unit {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 6px;
    }

    .remove-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .remove-btn:hover {
      background: var(--surface-hover);
      color: var(--danger);
    }

    .chart-container {
      height: 200px;
      position: relative;
    }

    .empty-state {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 48px;
      opacity: 0.5;
    }

    .muted {
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module" src="./sync.tsx"></script>
</body>
</html>
